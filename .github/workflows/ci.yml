name: Repository CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository files
        run: python scripts/check_repository.py
      - name: Test GitFlow and configuration behavior
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check

  gitflow:
    name: GitFlow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate PR routing
        run: python scripts/check_gitflow.py

  required:
    name: ${{ github.event_name == 'pull_request' && 'Required checks' || 'Branch checks' }}
    if: ${{ always() }}
    needs: [repository, gitflow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          GITFLOW_RESULT: ${{ needs.gitflow.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$GITFLOW_RESULT" = success
