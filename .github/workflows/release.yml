name: Release Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to package and upload assets for (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

concurrency:
  group: release-pipeline-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build xvfb \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libx11-xcb1 libxrender1 libxi6 libxcursor1 libvulkan-dev

      - name: Install Ninja on Windows/macOS
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install ninja
          elif [ "${{ runner.os }}" = "Windows" ]; then
            choco install ninja
          fi

      - name: Set up Qt 6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          cache: true
          setup-python: false

      - name: Patch Qt 6 AGL framework for macOS SDK 15+ (QTBUG-137687)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find "${RUNNER_WORKSPACE}" -type f \( -name "*.cmake" -o -name "*.prl" \) -exec sed -i '' 's/-framework AGL//g' {} + 2>/dev/null || true

      - name: Set up MSVC environment on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build PhotoCarta
        shell: bash
        run: cmake --build build --config Release

      - name: Run Qt behavioral tests & startup smoke tests (Linux xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum ctest --test-dir build --output-on-failure --build-config Release

      - name: Run Qt behavioral tests & startup smoke tests
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --build-config Release

      - name: Package standalone application binaries
        shell: bash
        run: |
          python scripts/package.py --build-dir build --output-dir packages

      - name: Verify packaged application starts
        shell: bash
        run: |
          python scripts/verify_package.py --package-dir packages

      - name: Upload packaged application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.os }}
          path: packages/*
          if-no-files-found: error

  publish-assets:
    name: Publish Release Assets
    needs: [build-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: all-packages

      - name: Prepare assets directory
        run: |
          mkdir -p release-assets
          find all-packages -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum PhotoCarta-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Upload assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" release-assets/* --clobber
