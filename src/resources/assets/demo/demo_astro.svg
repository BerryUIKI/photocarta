<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="nebulaCore" cx="45%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="milkyWayBand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#67e8f9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Deep Night Space -->
  <rect width="800" height="600" fill="url(#spaceGrad)"/>
  <!-- Milky Way Galactic Dust Lane -->
  <polygon points="120,600 240,600 680,0 560,0" fill="url(#milkyWayBand)"/>
  <circle cx="420" cy="240" r="180" fill="url(#nebulaCore)"/>
  <!-- Stars Layer -->
  <!-- Bright Stars with diffraction spikes -->
  <g fill="#ffffff">
    <circle cx="280" cy="120" r="2.5"/>
    <line x1="274" y1="120" x2="286" y2="120" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="280" y1="114" x2="280" y2="126" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="510" cy="180" r="2.5"/>
    <line x1="504" y1="180" x2="516" y2="180" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="510" y1="174" x2="510" y2="186" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="360" cy="80" r="3"/>
    <line x1="352" y1="80" x2="368" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="360" y1="72" x2="360" y2="88" stroke="#ffffff" stroke-width="1"/>
    <!-- Small star points -->
    <circle cx="90" cy="80" r="1.2"/>
    <circle cx="150" cy="190" r="1.4"/>
    <circle cx="210" cy="60" r="1.1"/>
    <circle cx="320" cy="210" r="1.5"/>
    <circle cx="390" cy="140" r="1.6"/>
    <circle cx="450" cy="90" r="1.2"/>
    <circle cx="480" cy="270" r="1.5"/>
    <circle cx="570" cy="110" r="1.3"/>
    <circle cx="630" cy="230" r="1.4"/>
    <circle cx="710" cy="70" r="1.2"/>
    <circle cx="740" cy="170" r="1.6"/>
    <circle cx="680" cy="310" r="1.1"/>
    <circle cx="240" cy="290" r="1.3"/>
    <circle cx="180" cy="330" r="1.5"/>
    <circle cx="340" cy="330" r="1.7"/>
    <circle cx="430" cy="310" r="1.4"/>
    <circle cx="530" cy="50" r="1.2"/>
  </g>
  <!-- Desert Rock Arch Silhouette in Foreground -->
  <path d="M 0 600 L 0 450 Q 80 430 160 480 Q 220 520 280 480 Q 340 330 460 310 Q 560 300 640 430 Q 700 520 800 480 L 800 600 Z" fill="#030712"/>
  <!-- Arch Hole / Window to stars -->
  <path d="M 370 600 Q 360 420 440 390 Q 520 400 540 600 Z" fill="url(#spaceGrad)"/>
  <!-- Demo watermark badge -->
  <rect x="24" y="24" width="130" height="30" rx="6" fill="#090a0f" fill-opacity="0.75" stroke="#475569" stroke-width="1"/>
  <text x="89" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">DEMO FIXTURE</text>
</svg>
