<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="archSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="concreteLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="concreteShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glassFacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <!-- Minimalist Blue Sky -->
  <rect width="800" height="600" fill="url(#archSky)"/>
  <!-- Primary Geometric Mass -->
  <polygon points="150,600 150,180 480,80 480,600" fill="url(#concreteLight)"/>
  <!-- Shadow Facet -->
  <polygon points="480,80 720,220 720,600 480,600" fill="url(#concreteShade)"/>
  <!-- Cantilever Roof / Wing -->
  <polygon points="80,190 540,60 520,30 60,170" fill="#f8fafc"/>
  <!-- Glass Window Matrix -->
  <polygon points="200,240 430,170 430,520 200,520" fill="url(#glassFacade)" opacity="0.9"/>
  <!-- Glass Grid Lines -->
  <line x1="200" y1="310" x2="430" y2="250" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="380" x2="430" y2="330" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="450" x2="430" y2="410" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <line x1="260" y1="220" x2="260" y2="520" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <line x1="320" y1="205" x2="320" y2="520" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="185" x2="380" y2="520" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <!-- Dramatic Architectural Shadow on Ground -->
  <polygon points="0,600 800,600 800,550 560,540 150,560 0,600" fill="#0f172a" opacity="0.8"/>
  <!-- Demo watermark badge -->
  <rect x="24" y="24" width="130" height="30" rx="6" fill="#090a0f" fill-opacity="0.75" stroke="#475569" stroke-width="1"/>
  <text x="89" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">DEMO FIXTURE</text>
</svg>
